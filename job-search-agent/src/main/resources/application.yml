logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: debug
spring:
  application:
    name: job-search-agent
  ai:
    openai:
      api-key: ${OPEN_API_KEY}
    mcp:
      client:
        streamable-http:
          connections:
            firecrawl:
              url: https://mcp.firecrawl.dev
              endpoint: /v2/mcp
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/job-search-agent}
  data:
    mongodb:
      # Creates the indexes declared on the documents (e.g. one resume per user and version).
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

firecrawl:
  api-key: ${FIRECRAWL_API_KEY}

auth:
  cognito:
    # https://cognito-idp.<region>.amazonaws.com/<userPoolId>
    issuer-uri: ${COGNITO_ISSUER_URI}
    # The SPA app client - only access tokens issued to this client are accepted.
    client-id: ${COGNITO_CLIENT_ID}
  # Comma-separated. Only needed when the frontend isn't served via the Vite dev proxy.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resume:
  s3:
    # AWS credentials are not configured here: the SDK finds them itself - ~/.aws/credentials or
    # AWS_* environment variables locally, the task/instance role when running on AWS.
    bucket: ${RESUME_S3_BUCKET}
    # Leave unset to use the SDK's own region lookup (AWS_REGION, ~/.aws/config, or the AWS runtime).
    region: ${RESUME_S3_REGION:}
  # How long a resume download link stays valid.
  download-url-ttl: 5m

job-search:
  model: gpt-4.1
  max-attempts-per-batch: 2
  rate-limit-retry-delay: 30s

  # Used by the daily job (the "job" profile - see application-job.yml).
  daily-run:
    page-size: 50
    delay-between-users: 5s
    # Set to true to search again for users already searched today (JOB_SEARCH_FORCE=true).
    force: ${JOB_SEARCH_FORCE:false}
