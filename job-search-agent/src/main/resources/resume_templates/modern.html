<!DOCTYPE html>
<!-- Modern: sans-serif type, a left-aligned header and teal accents. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${resume.name()}">Resume</title>
    <style>
        @page { size: A4; margin: 15mm 17mm; }
        body { font-family: 'Lato', 'Liberation Sans'; font-size: 10pt; line-height: 1.4; color: #1f2937; margin: 0; }
        p, li, .details { white-space: pre-line; word-wrap: break-word; margin: 0; }
        .header { border-bottom: 2pt solid #0f766e; padding-bottom: 7pt; margin-bottom: 4pt; }
        .name { font-size: 24pt; font-weight: bold; color: #111827; line-height: 1.1; }
        .headline { font-size: 12pt; font-weight: bold; color: #0f766e; margin-top: 3pt; }
        .contact { font-size: 9pt; color: #4b5563; margin-top: 5pt; word-wrap: break-word; }
        h2 { font-size: 10.5pt; font-weight: bold; text-transform: uppercase; color: #0f766e;
             margin: 12pt 0 4pt 0; page-break-after: avoid; }
        .skills { line-height: 1.9; }
        .skill { display: inline-block; background-color: #e6f2f1; color: #134e4a; padding: 0 5pt; margin-right: 3pt; font-size: 9pt; }
        .entry { margin-top: 6pt; }
        .entry-head { width: 100%; border-collapse: collapse; page-break-inside: avoid; page-break-after: avoid; }
        .entry-head td { padding: 0; vertical-align: top; word-wrap: break-word; }
        .title { font-weight: bold; font-size: 10.5pt; color: #111827; }
        .dates { width: 1%; white-space: nowrap; text-align: right; font-size: 9pt; color: #4b5563; padding-left: 10pt; }
        .where { font-size: 9.5pt; color: #0f766e; }
        .where .location { color: #4b5563; }
        ul { margin: 2pt 0 0 0; padding-left: 12pt; }
        li { margin-bottom: 1.5pt; page-break-inside: avoid; }
    </style>
</head>
<body>
<div class="header">
    <div class="name" th:if="${resume.name() != null}" th:text="${resume.name()}">Jane Doe</div>
    <div class="headline" th:if="${resume.headline() != null}" th:text="${resume.headline()}">Headline</div>
    <div class="contact" th:unless="${resume.contact().isEmpty()}"><th:block th:each="item, it : ${resume.contact()}"><span th:text="${item}">contact</span><span th:unless="${it.last}">   |   </span></th:block></div>
</div>

<th:block th:if="${resume.summary() != null}">
    <h2>Summary</h2>
    <p th:text="${resume.summary()}">Summary</p>
</th:block>

<th:block th:unless="${resume.skills().isEmpty()}">
    <h2>Skills</h2>
    <div class="skills"><th:block th:each="skill : ${resume.skills()}"><span class="skill" th:text="${skill}">skill</span><span> </span></th:block></div>
</th:block>

<th:block th:unless="${resume.experience().isEmpty()}">
    <h2>Experience</h2>
    <div class="entry" th:each="role : ${resume.experience()}">
        <table class="entry-head"><tr>
            <td class="title" th:text="${role.title() != null ? role.title() : role.company()}">Title</td>
            <td class="dates" th:if="${role.dates() != null}" th:text="${role.dates()}">Dates</td>
        </tr></table>
        <div class="where" th:if="${(role.title() != null and role.company() != null) or role.location() != null}"><span th:if="${role.title() != null}" th:text="${role.company()}">Company</span><span th:if="${role.title() != null and role.company() != null and role.location() != null}">  ·  </span><span class="location" th:text="${role.location()}">Location</span></div>
        <ul th:unless="${role.bullets().isEmpty()}">
            <li th:each="bullet : ${role.bullets()}" th:text="${bullet}">Bullet</li>
        </ul>
    </div>
</th:block>

<th:block th:unless="${resume.education().isEmpty()}">
    <h2>Education</h2>
    <div class="entry" th:each="entry : ${resume.education()}">
        <table class="entry-head"><tr>
            <td class="title" th:text="${entry.qualification() != null ? entry.qualification() : entry.institution()}">Qualification</td>
            <td class="dates" th:if="${entry.dates() != null}" th:text="${entry.dates()}">Dates</td>
        </tr></table>
        <div class="where" th:if="${entry.qualification() != null and entry.institution() != null}" th:text="${entry.institution()}">Institution</div>
        <div class="details" th:if="${entry.details() != null}" th:text="${entry.details()}">Details</div>
    </div>
</th:block>

<th:block th:unless="${resume.certifications().isEmpty()}">
    <h2>Certifications</h2>
    <ul><li th:each="item : ${resume.certifications()}" th:text="${item}">Certification</li></ul>
</th:block>

<th:block th:each="section : ${resume.additionalSections()}">
    <h2 th:text="${section.heading()}">Section</h2>
    <ul><li th:each="item : ${section.items()}" th:text="${item}">Item</li></ul>
</th:block>
</body>
</html>
